[package]
name = "gba-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GBA machine model: ARM7TDMI interpreter, memory map, hardware"

[dependencies]
armv4t = { path = "../armv4t" }

# No libc / windows-sys here. Upstream pulled those in for exactly one thing —
# localtime_r / GetLocalTime behind the cartridge RTC — and on MVII the host
# clock arrives through the `gba_mvii_host_epoch` hook instead. See
# hostclock.rs and nostd.rs.
